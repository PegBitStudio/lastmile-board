<style id="sheet">
:root{
  --paper:#F4F5F2; --surface:#FFFFFF; --surface-2:#ECEEE9;
  --ink:#14171A; --ink-soft:#3E4650; --mute:#7C7A73; --rule:#D4D6CF;
  --amber:#C06E05; --amber-soft:#F5E3C6;
  --moss:#2F6B4F;  --moss-soft:#D8E6DD;
  --rust:#A33B22;  --rust-soft:#F6DDD6;
  --dami:#2F5474;  --dami-soft:#DCE6EF;
  --yashfa:#6B4478; --yashfa-soft:#EADFEE;
  --display:"Archivo Narrow","Arial Narrow",Helvetica,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --gutter:clamp(1rem,3.5vw,2.5rem);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101316; --surface:#171B1F; --surface-2:#1E242A;
  --ink:#ECEEE9; --ink-soft:#B4BCC4; --mute:#878E94; --rule:#2C333A;
  --amber:#E9A23B; --amber-soft:#3A2C13;
  --moss:#6FBF95;  --moss-soft:#17301F;
  --rust:#E38166;  --rust-soft:#3A1C14;
  --dami:#8FB6D6;  --dami-soft:#1B2C3A;
  --yashfa:#C39BD0; --yashfa-soft:#2C1E33;
}}
:root[data-theme="dark"]{
  --paper:#101316; --surface:#171B1F; --surface-2:#1E242A;
  --ink:#ECEEE9; --ink-soft:#B4BCC4; --mute:#878E94; --rule:#2C333A;
  --amber:#E9A23B; --amber-soft:#3A2C13;
  --moss:#6FBF95;  --moss-soft:#17301F;
  --rust:#E38166;  --rust-soft:#3A1C14;
  --dami:#8FB6D6;  --dami-soft:#1B2C3A;
  --yashfa:#C39BD0; --yashfa-soft:#2C1E33;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:74rem;margin:0 auto;padding:0 var(--gutter) 5rem}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--ink);padding:.9rem 0 .7rem;margin-bottom:1.5rem}
.toprow{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1.5rem}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:-.015em;margin:0;line-height:1}
.when{font-family:var(--mono);font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.counts{display:flex;gap:1.25rem;margin-left:auto;font-family:var(--mono);font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.counts b{font-family:var(--display);font-size:1rem;letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums}
.counts .hot b{color:var(--rust)}
.savebar{display:flex;align-items:center;gap:.75rem;margin-top:.6rem;font-family:var(--mono);font-size:.625rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--mute);flex:none}
.dot.ok{background:var(--moss)} .dot.busy{background:var(--amber)} .dot.local{background:var(--rust)}
button.act{font-family:var(--mono);font-size:.625rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:none;color:var(--mute);border:1px solid var(--rule);border-radius:2px;padding:.35rem .6rem;cursor:pointer}
button.act:hover{color:var(--ink);border-color:var(--ink)}
button.act:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* balance */
.balance{display:grid;grid-template-columns:1fr;gap:.75rem;margin:0 0 2rem}
@media(min-width:44rem){.balance{grid-template-columns:1fr 1fr}}
.bcard{border:1px solid var(--rule);border-radius:3px;background:var(--surface);padding:.8rem .95rem}
.bcard .who{font-family:var(--display);font-weight:700;font-size:1.05rem}
.bcard.d .who{color:var(--dami)} .bcard.y .who{color:var(--yashfa)}
.bnums{display:flex;gap:1.1rem;margin-top:.35rem;font-family:var(--mono);font-size:.6875rem;color:var(--mute);flex-wrap:wrap}
.bnums b{font-family:var(--display);font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:.6rem;background:var(--surface-2)}
.bar i{display:block}
.bar .s-done{background:var(--moss)} .bar .s-doing{background:var(--amber)} .bar .s-blocked{background:var(--rust)}

/* sections */
h2{font-family:var(--display);font-weight:700;font-size:1.35rem;margin:0 0 .2rem;letter-spacing:-.01em}
.sub{font-size:.875rem;color:var(--mute);margin:0 0 .9rem}
section{margin-bottom:2.5rem}
.lanes{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:52rem){.lanes{grid-template-columns:1fr 1fr;gap:1.5rem}}
.lane h3{font-family:var(--mono);font-size:.625rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 .4rem;padding-bottom:.3rem;border-bottom:2px solid}
.lane.d h3{color:var(--dami);border-color:var(--dami)}
.lane.y h3{color:var(--yashfa);border-color:var(--yashfa)}
.empty{font-size:.875rem;color:var(--mute);padding:.6rem 0;font-style:italic}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto auto 1fr auto;gap:.55rem;align-items:start;padding:.5rem 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row.is-done .txt{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.txt{font-size:.9375rem;line-height:1.4}
.txt .note{display:block;font-size:.78rem;color:var(--mute);margin-top:.1rem}
.chip{font-family:var(--mono);font-size:.5625rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid;border-radius:2px;padding:.22rem .4rem;cursor:pointer;background:none;white-space:nowrap;line-height:1.1}
.st-todo{color:var(--mute);border-color:var(--rule)}
.st-doing{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.st-blocked{color:var(--rust);border-color:var(--rust);background:var(--rust-soft)}
.st-done{color:var(--moss);border-color:var(--moss);background:var(--moss-soft)}
.ow-D{color:var(--dami);border-color:var(--dami);background:var(--dami-soft)}
.ow-Y{color:var(--yashfa);border-color:var(--yashfa);background:var(--yashfa-soft)}
.ow-B{color:var(--ink-soft);border-color:var(--ink-soft);background:var(--surface-2)}
.star{background:none;border:0;cursor:pointer;color:var(--rule);font-size:1rem;line-height:1;padding:.1rem .2rem}
.star.on{color:var(--amber)}
.wk{font-family:var(--mono);font-size:.5625rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap;padding-top:.25rem}

/* blockers */
.blockers{display:grid;grid-template-columns:1fr;gap:1rem;margin-top:1rem}
@media(min-width:52rem){.blockers{grid-template-columns:1fr 1fr;gap:1.5rem}}
.blockers label{display:block;font-family:var(--mono);font-size:.5625rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:.3rem}
.blockers textarea{width:100%;min-height:3.4rem;resize:vertical;font-family:var(--body);font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:.5rem .6rem;line-height:1.4}
.blockers textarea:focus{outline:2px solid var(--amber);outline-offset:1px}

/* week nav */
.wknav{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.wknav button{font-family:var(--mono);font-size:.625rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--mute);border-radius:2px;padding:.4rem .6rem;cursor:pointer}
.wknav button.on{color:var(--paper);background:var(--ink);border-color:var(--ink)}

.banner{border:1px solid var(--rust);border-left-width:3px;background:var(--rust-soft);border-radius:2px;padding:.7rem .9rem;margin-bottom:1.25rem;font-size:.875rem}
.banner b{color:var(--rust)}
footer{border-top:1px solid var(--rule);margin-top:2rem;padding-top:.9rem;font-family:var(--mono);font-size:.625rem;letter-spacing:.05em;color:var(--mute);display:flex;flex-wrap:wrap;gap:.4rem 1.5rem}
@media print{.top{position:static}.savebar,.wknav,.star,button.act{display:none}}
</style>

    + '<p>One call every day. <b>20 minutes, not longer.</b> 14:00 in Nigeria, 18:00 in Pakistan.</p>'

    + '<div class="card"><h3>Who decides</h3>'

    + '<p>One small swap task each week, outside your own area, so neither half of the project is a mystery.</p></div>'
    + '</div>'

    + '<h3 style="margin-top:2rem">Who owns what</h3>'

    + '<tr><td>Region pack: Lahore</td><td class="who-y">Yashfa</td></tr>'
    + '<tr><td>Region pack: UK / London</td><td class="who-y">Yashfa</td></tr>'
    + '<tr><td>Region pack: Nigeria / Lagos</td><td class="who-d">Dami</td></tr>'

function renderBody(st){
  state = st;
  const today = state.tasks.filter(t => t.t && t.s!=="done");
  const wk = WEEKS.find(w => w.k===view) || WEEKS[0];
  const inWeek = view === "done"
    ? state.tasks.filter(t => t.s === "done").slice().sort((a,b) => (b.d||"").localeCompare(a.d||""))
    : state.tasks.filter(t => t.w===view);
  const cd = counts("D"), cy = counts("Y");

  const bar = c => {
    const p = n => c.all ? (n/c.all*100).toFixed(1) + "%" : "0%";
    return '<div class="bar"><i class="s-done" style="width:' + p(c.done) + '"></i>'
      + '<i class="s-doing" style="width:' + p(c.doing) + '"></i>'
      + '<i class="s-blocked" style="width:' + p(c.blocked) + '"></i></div>';
  };
  const bcard = (who, c) => '<div class="bcard ' + (who==="D"?"d":"y") + '"><span class="who">' + OWNER_NAME[who] + '</span>'
    + '<div class="bnums"><span><b>' + c.open + '</b> open</span><span><b>' + c.doing + '</b> doing</span>'
    + '<span><b>' + c.blocked + '</b> blocked</span><span><b>' + c.done + '</b> done</span></div>' + bar(c) + '</div>';

  return '<div class="top"><div class="toprow">'
    + '<h1>Work Board</h1>'
    + '<span class="when">Lastmile · updated ' + esc(state.updated) + '</span>'
    + '<span class="counts"><span>Freeze Sep 24 <b>' + daysTo("2026-09-24") + 'd</b></span>'
    + '<span class="hot">Submit Sep 29 <b>' + daysTo("2026-09-29") + 'd</b></span></span>'
    + '</div><div class="savebar"><span class="dot" id="dot"></span><span id="saymsg">Starting up</span>'
    + '<button class="act" id="savebtn" type="button">Save now</button></div></div>'

    + '<div id="bannerslot"></div>'

    + '<div class="balance">' + bcard("D", cd) + bcard("Y", cy) + '</div>'

    + '<section><h2>Today</h2><p class="sub">Starred tasks that are not finished. Star anything below to pin it here.</p>'
    + '<div class="lanes">' + laneHTML("D", today) + laneHTML("Y", today) + '</div>'
    + '<div class="blockers">'
    + '<div><label for="bd">Dami — what is blocking me</label><textarea id="bd" data-who="D" placeholder="Nothing right now">' + esc(state.blockers.D) + '</textarea></div>'
    + '<div><label for="by">Yashfa — what is blocking me</label><textarea id="by" data-who="Y" placeholder="Nothing right now">' + esc(state.blockers.Y) + '</textarea></div>'
    + '</div></section>'

    + '<section><h2>' + esc(wk.full) + '</h2>'
    + '<p class="sub">' + (view === "plan"
        ? 'The rules we agreed. Read it once, then come back when something is unclear.'
        : 'Click the left chip to change status. Click the name to reassign. Click the star to pin it to Today.') + '</p>'
    + '<div class="wknav">' + WEEKS.map(w => '<button type="button" data-week="' + w.k + '"' + (w.k===view ? ' class="on"' : '') + '>' + esc(w.label)
        + (w.k === "done" ? ' (' + state.tasks.filter(t => t.s === "done").length + ')' : '') + '</button>').join("") + '</div>'
    + (view === "plan" ? planHTML()
       : inWeek.length ? '<div class="rows">' + inWeek.map(t => rowHTML(t, view === "done")).join("") + '</div>'
                       : '<p class="empty">' + (view === "done" ? 'Nothing finished yet.' : 'Nothing here.') + '</p>')
    + '</section>'

    + '<footer><span>Lastmile Work Board</span><span>Shared board \u00b7 ticks are saved for both of us</span></footer>';
}

function paint(){ document.getElementById("app").innerHTML = renderBody(state); wire(); say(); }

function say(msg, kind){
  const dot = document.getElementById("dot"), m = document.getElementById("saymsg");
  if(!dot || !m) return;
  dot.className = "dot" + (kind ? " " + kind : "");
  m.textContent = msg || (mode==="shared"
    ? (dirty ? "Unsaved changes" : "Shared — you and your teammate see the same board")
    : "Saved on this device only");
  if(!kind) dot.className = "dot " + (mode==="shared" ? (dirty ? "busy" : "ok") : "local");
}

function banner(html){
  const el = document.getElementById("bannerslot");
  if(el) el.innerHTML = html ? '<div class="banner">' + html + '</div>' : "";
}

const SUPABASE_URL = "https://kysvaqktqlvgzvwkveze.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5c3ZhcWt0cWx2Z3p2d2t2ZXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0ODM5ODcsImV4cCI6MjEwMzA1OTk4N30.zRKJP6aD_u2QfauWgbVgPii0U5SZlTTCm-h_qbjkUa4";
const ROW_ID = "main";

var staleLocal = false, localReason = "", lastSeen = "", polling = null;

function configured(){
  return SUPABASE_URL.indexOf("PASTE_") === -1 && SUPABASE_KEY.indexOf("PASTE_") === -1;
}

function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json"
  }, opts.headers || {});
  return fetch(SUPABASE_URL + "/rest/v1" + path, opts);
}

function stash(){ try{ localStorage.setItem("lastmile-board-v1", JSON.stringify(state)); }catch(e){} }

function goLocal(why){
  mode = "local";
  localReason = why || localReason;
  drawBanner();
  say();
}

function drawBanner(){
  var html = "";
  if(mode === "local"){
    html += '<b>Saving is off. Your clicks stay in this browser and your teammate will not see them.</b>'
      + '<p style="margin:.5rem 0 0">' + localReason + '</p>';
  }
  banner(html);
}

async function pull(force){
  if(!configured()) return;
  try{
    const r = await api("/board?id=eq." + ROW_ID + "&select=state,updated_at");
    if(!r.ok) throw new Error(r.status);
    const rows = await r.json();
    if(!rows.length){
      await api("/board", { method:"POST", headers:{Prefer:"return=minimal"},
        body: JSON.stringify({ id: ROW_ID, state: state, updated_at: new Date().toISOString() }) });
      lastSeen = new Date().toISOString();
      mode = "shared"; drawBanner(); say();
      return;
    }
    const row = rows[0];
    mode = "shared";
    if((force || !dirty) && row.updated_at > lastSeen){
      lastSeen = row.updated_at;
      state = row.state;
      stash();
      paint();
      drawBanner();
    }
    say();
  }catch(e){
    goLocal("Could not reach the shared board. Check the two Supabase values in this page.");
  }
}

async function save(){
  state.updated = new Date().toISOString().slice(0,10);
  stash();
  if(!configured()){ dirty = false; goLocal("This page has no Supabase details in it yet."); return; }
  say("Saving", "busy");
  try{
    const now = new Date().toISOString();
    const r = await api("/board?id=eq." + ROW_ID, {
      method: "PATCH",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify({ state: state, updated_at: now })
    });
    if(!r.ok) throw new Error(r.status);
    lastSeen = now;
    dirty = false; mode = "shared";
    say("Saved", "ok"); setTimeout(say, 1200);
  }catch(e){
    goLocal("The save was refused. Check the table and its policies in Supabase.");
  }
}

function queue(){ dirty = true; say(); clearTimeout(timer); timer = setTimeout(save, 2500); }

function wire(){
  document.querySelectorAll(".wknav button").forEach(function(b){ b.onclick = function(){ view = b.dataset.week; paint(); }; });
  document.querySelectorAll(".row [data-act]").forEach(function(el){
    el.onclick = function(){
      var id = el.closest(".row").dataset.id;
      var t = state.tasks.find(function(x){ return x.id === id; });
      if(!t) return;
      var a = el.dataset.act;
      if(a === "status"){
        t.s = STATUSES[(STATUSES.indexOf(t.s) + 1) % STATUSES.length];
        if(t.s === "done") t.d = new Date().toISOString().slice(0,10);
        else delete t.d;
      }
      if(a === "owner")  t.o = OWNERS[(OWNERS.indexOf(t.o) + 1) % OWNERS.length];
      if(a === "star")   t.t = t.t ? 0 : 1;
      paint(); queue();
    };
  });
  document.querySelectorAll(".blockers textarea").forEach(function(ta){
    ta.oninput = function(){ state.blockers[ta.dataset.who] = ta.value; queue(); };
  });
  var btn = document.getElementById("savebtn");
  if(btn) btn.onclick = function(){ clearTimeout(timer); save(); };
}

(function start(){
  let seed = STATE;
  try{
    const local = JSON.parse(localStorage.getItem("lastmile-board-v1") || "null");
    if(local && local.updated >= STATE.updated) seed = local;
  }catch(e){}
  state = seed;
  paint();
  if(!configured()){
    goLocal("This page has no Supabase details in it yet, so it is only saving in this browser.");
    return;
  }
  pull(true);
  polling = setInterval(function(){ pull(false); }, 5000);
})();
</script>
